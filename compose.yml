services:
  db:
    image: postgis/postgis:16-3.4-alpine
    container_name: gis_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gis_db
    ports:
      - "56432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

